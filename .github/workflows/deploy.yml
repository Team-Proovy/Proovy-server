name: Deploy Backend (EC2)

on:
  push:
    branches: ["dev"]

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build -x test

      - name: Find jar
        run: |
          ls -al build/libs
          echo "JAR_PATH=$(ls build/libs/*.jar | head -n 1)" >> $GITHUB_ENV

      - name: Upload jar to EC2 (scp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: ${{ env.JAR_PATH }}
          target: "/tmp"

      - name: Deploy on EC2 (ssh)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/proovy' }}"
            SERVICE_NAME="${{ secrets.SERVICE_NAME || 'proovy' }}"

            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown -R $USER:$USER "$DEPLOY_PATH"

            NEW_JAR=$(ls -t /tmp/*.jar | head -n 1)
            echo "New jar: $NEW_JAR"

            mv "$NEW_JAR" "$DEPLOY_PATH/app.jar"

            sudo systemctl restart "$SERVICE_NAME"
            sudo systemctl status "$SERVICE_NAME" --no-pager -l
