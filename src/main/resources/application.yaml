spring:
  application:
    name: proovy-api

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:proovy}
    username: ${DB_USERNAME:proovy}
    password: ${DB_PASSWORD:proovy123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  # 신규 제품 baseline(V1)은 빈 DB에서만 시작한다. 과거 migration history가 있거나
  # history 없이 테이블이 있는 DB는 baseline하지 않고 기동을 실패시킨다 (ADR 0015).
  flyway:
    baseline-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  mvc:
    async:
      # SSE 스트리밍 요청은 장시간 연결이 유지되므로 타임아웃을 해제한다.
      request-timeout: -1

  task:
    scheduling:
      time-zone: Asia/Seoul
      pool:
        size: 3

springdoc:
  swagger-ui:
    tagsSorter: alpha
    url: /v3/api-docs
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  forward-headers-strategy: framework

# ===============================
# GCS 설정
# ===============================
gcs:
  project-id: ${GCS_PROJECT_ID}
  bucket: ${GCS_BUCKET:proovy-assets-dev}
  # 서비스 계정 JSON 키 (문자열 전체). 미설정 시 ADC 사용 (Cloud Run 권장)
  credentials-json: ${GCS_CREDENTIALS_JSON:}
  # 로컬 GCS 에뮬레이터 endpoint. 미설정 시 실제 GCS 사용
  endpoint: ${GCS_ENDPOINT:}

# ===============================
# OAuth 설정
# ===============================
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}
    # 카카오 API 엔드포인트
    auth-url: https://kauth.kakao.com
    api-url: https://kapi.kakao.com
    # 개별 엔드포인트
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    token-info-uri: https://kapi.kakao.com/v1/user/access_token_info

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    # redirectUri는 서버에서 고정 (보안상 Request Body에서 받지 않음)
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:5173/oauth/naver/callback}
    # 네이버 API 엔드포인트
    authorize-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    # state 유효 시간 (초)
    state-ttl: 300


# ===============================
# JWT 설정 (서비스 자체 토큰)
# ===============================
jwt:
  secret: ${JWT_SECRET}                    # 최소 256bit (32자 이상)
  access-token-expiration: 3600            # 1시간 (초)
  refresh-token-expiration: 604800         # 7일 (초)
  signup-token-expiration: 600             # 10분 (초)

proovy:
  api:
    public-base-url: ${PROOVY_API_BASE_URL:}
  # Brain 내부 실행 API client (task 1.76). base-url이 비어 있으면 client bean을 만들지 않는다.
  # 인증은 한 모드만: production은 id-token(고정 audience), local/test는 shared-token.
  brain:
    base-url: ${BRAIN_BASE_URL:}
    auth:
      mode: ${BRAIN_AUTH_MODE:shared-token}
      audience: ${BRAIN_ID_TOKEN_AUDIENCE:}
      shared-token: ${BRAIN_SHARED_TOKEN:}

internal:
  api:
    token: ${INTERNAL_API_TOKEN}
    port: 8081

# ===============================
# OpenRouter API (Gemini 2.5 Flash 경유)
# ===============================
openrouter:
  api:
    key: ${OPENROUTER_API_KEY}
    model: google/gemini-2.5-flash-lite-preview-09-2025

---
# ===============================
# Local 환경
# ===============================
spring:
  config:
    activate:
      on-profile: local

  # schema는 Flyway만 관리한다. Hibernate는 엔티티와 baseline 정합성만 검증한다.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

internal:
  api:
    token: ${INTERNAL_API_TOKEN:local-dev-token}

---
# ===============================
# Production 환경
# ===============================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      ssl:
        enabled: true

proovy:
  api:
    public-base-url: ${PROOVY_API_BASE_URL:https://api.proovy.ai.kr}
  brain:
    auth:
      mode: id-token
